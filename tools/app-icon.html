<title>App icon source</title>
<!--
  Source for candidate_profiles_site/assets/apple-touch-icon.png (180x180)
  and assets/icon-512.png (512x512), the icons a phone uses when the site is

  assets/favicon.svg, on a full square: iOS rounds the corners itself.

  Regenerate with a 180x180 and a 512x512 window at device scale 1:

    chrome --headless --disable-gpu --window-size=180,180 \
      --force-device-scale-factor=1 --hide-scrollbars \
      --screenshot=candidate_profiles_site/assets/apple-touch-icon.png \
      "tools/app-icon.html"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "know-your-candidate"
version = "2.1.0"
description = "Pipeline turning curated congressional rosters into a static civic directory."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

# Deliberately empty, and checked in CI. The pipeline is standard-library
# only: pandas was removed on purpose, and a build that needs a wheel is a
# build a volunteer cannot run offline before an election.
dependencies = []

[project.scripts]
know-your-candidate = "kyc.cli:main"

[tool.setuptools]
packages = ["kyc"]

[tool.ruff]
line-length = 96
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "C4", "SIM"]
ignore = [
    # The pipeline is written for 3.9 and cannot use newer syntax sugar.
    "UP006",
    "UP007",
    "UP035",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]  # sys.path is adjusted before the package imports

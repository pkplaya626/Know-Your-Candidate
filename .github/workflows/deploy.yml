# Publish candidate_profiles_site/ to GitHub Pages at
# https://candidates.radicalrelay.us (see candidate_profiles_site/CNAME).
#
# Runs on every push to main that touches the site, plus on demand. The
# validation gate below is the point: a deploy must never publish data the
# validator rejects, or data that no longer matches the CSVs it came from.

name: Deploy

on:
  push:
    branches: [main]
    # Documentation and pipeline-internal changes do not change what is
    # served, so they do not need to redeploy the site.
    paths:
      - "candidate_profiles_site/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why this deploy is happening"
        required: false
        default: "manual publish"

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. Never cancel one in flight: a half-finished upload
# would leave the live site serving a mix of two builds.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Verify, then package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A deploy must never publish data that the validator rejects. This is
      # the same gate CI runs, repeated here so a manual deploy cannot skip it.
      - name: Validate the data
        run: python build_profile_site.py build --check --strict

      # Also checks that CNAME, both pages, robots.txt and sitemap.xml name
      # the same host. A rename that updated only some of them would publish a
      # site advertising a hostname it is not served from.
      - name: Confirm the committed site is self-consistent
        run: python build_profile_site.py verify

      - name: Disable Jekyll processing
        run: touch candidate_profiles_site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: candidate_profiles_site

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

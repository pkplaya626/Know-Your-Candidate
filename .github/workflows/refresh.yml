# Keep the rosters in step with Congress.
#
# The roster CSVs are accurate but cannot stay current on their own. Members
# resign, die, and win special elections between builds, and a hand-maintained
# CSV has no way to notice: two representatives seated in September 2026 were
# simply absent from the site until this reconciliation was written.
#
# This opens a pull request and merges it once its CI passes (PK, 2026-10-14:
# results after the election must not wait days for a person). It never pushes
# to main directly: everything it publishes has passed build --check --strict,
# verify, the unit tests and the page tests first, and a run whose checks fail
# leaves its pull request open and opens the failure issue.

name: Refresh

on:
  schedule:
    # Every day at 07:20 UTC; the `gate` job below decides which days run,
    # so nobody has to remember to edit this. Off the hour because GitHub's
    # scheduler queues heavily at :00 and skips runs it cannot start.
    #   - until 2026-10-14: Mondays and Thursdays, since in the run-up a
    #     week-old field misses withdrawals and results;
    #   - 2026-10-15 to 2026-11-02, the eve of the election: every day. The third-quarter
    #     reports were due October 15 and the pre-general ones October 22; a
    #     Mon/Thu gate read Thursday's run before the Q3 filings and left
    #     every nominee's money at June 30 until the Monday after (the
    #     2026-10-17 audit, PA-1: $4M of cash on hand unread);
    #   - 2026-11-04 to 2026-12-15: every day, so who won reaches the page the
    #     morning after it is marked, through Georgia's December 1 and
    #     Louisiana's December 12 runoffs;
    #   - 2027-01-03 to 2027-01-14: every day, so the 120th Congress lands
    #     the morning after congress-legislators switches to it; a snapshot
    #     still of the 119th fails every build from January 6
    #     (validate.SNAPSHOT_BEHIND_DAYS);
    #   - otherwise: Mondays.
    - cron: "20 7 * * *"
  workflow_dispatch:
    inputs:
      portraits:
        description: "Also resolve portraits for anyone new"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  # A failed run opens (or comments on) a "Weekly refresh failed" issue.
  issues: write
  # To start CI on the pull request it opens (see "Open a pull request").
  actions: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  gate:
    name: Decide whether this run is due
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.due.outputs.run }}
    steps:
      - id: due
        run: |
          today="$(date -u +%Y-%m-%d)"
          weekday="$(date -u +%u)"
          run=true
          if [ "${{ github.event_name }}" = "schedule" ]; then
            if [ "$today" \> "2026-11-03" ] && [ ! "$today" \> "2026-12-15" ]; then
              run=true                                   # results: every day
            elif [ "$today" \> "2027-01-02" ] && [ ! "$today" \> "2027-01-14" ]; then
              run=true                                   # the 120th is sworn in: every day
            elif [ "$today" \> "2026-10-14" ] && [ "$today" \< "2026-11-03" ]; then
              run=true                                   # Q3 and pre-general filings: every day
            elif [ ! "$today" \> "2026-11-03" ]; then
              [ "$weekday" = "1" ] || [ "$weekday" = "4" ] || run=false
            else
              [ "$weekday" = "1" ] || run=false
            fi
          fi
          echo "run=$run" >> "$GITHUB_OUTPUT"

  refresh:
    name: Reconcile against congress-legislators
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The courts command reads four courts' pages in the runner's own
      # Chrome through tools/read_court_pages.mjs, which needs Node's
      # built-in WebSocket (Node 22 or later). Without it those courts keep
      # their last good read and the run says so (rule 57).
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Refresh the membership snapshot and apply any drift
        id: reconcile
        run: |
          python build_profile_site.py congress --apply --verbose | tee reconcile.log
          # Surface the summary line in the PR body rather than making a
          # reviewer open the run log.
          {
            echo 'summary<<REPORT'
            grep -E '^\s+(reconciliation:|\+|-|~|!)' reconcile.log || echo "  no drift"
            echo REPORT
          } >> "$GITHUB_OUTPUT"
          rm reconcile.log

      # A member with no portrait shows a silhouette. Resolving here means the
      # PR arrives complete rather than needing a second pass. The people on
      # the ballot with none are looked for on Wikidata by their own FEC id
      # and, for a sitting state legislator, on the legislature's own page
      # (kyc/nominee_photos.py); a source that cannot be read keeps what it
      # gave before and stops nothing.
      #
      # On a schedule the `inputs` context is empty, so the old condition
      # `inputs.portraits != false` compared null with false - and portraits
      # never ran on the weekly refresh. Only a manual run can opt out.
      - name: Resolve portraits for anyone new
        if: github.event_name != 'workflow_dispatch' || inputs.portraits
        run: python build_profile_site.py portraits

      # Optional. Without the secret this is skipped entirely rather than
      # burning the run on DEMO_KEY, which the FEC throttles after a handful
      # of requests. Add it at Settings -> Secrets -> Actions -> FEC_API_KEY.
      #
      # The condition tests `env`, not `secrets`: the secrets context is not
      # available in a step-level `if`, so the obvious spelling would never be
      # true and the step would silently never run.
      #
      # --refresh: without it `fec.resolve_all` fetches only profiles missing
      # from the cache, so every cached incumbent kept the totals of the day
      # they were first looked up while challengers' totals moved weekly.
      # Request budget (the key answers 60 a minute; fec._get paces to it,
      # rule 37): about 540 members by id at one request each, ~60 roster
      # challengers at up to two, then up to 150 on-ballot challengers' own
      # totals (fec.FIELD_PER_RUN, each re-read about weekly), ~45 pages of
      # the field, and the campaign lookups below. A stop here is a warning,
      # not a failure: cached figures stay and the next run resumes, so the
      # field and results steps below still run.
      - name: Refresh campaign finance
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        if: env.FEC_API_KEY != ''
        run: python build_profile_site.py finance --refresh

      # Who has filed, and - from the state election pages - who is still in.
      - name: Refresh the candidate field and primary results
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        if: env.FEC_API_KEY != ''
        run: |
          python build_profile_site.py field
          python build_profile_site.py results

      # Campaign websites, one committee lookup each. Capped so the weekly
      # run stays inside the key's hourly budget alongside the steps above;
      # the cache resumes where it left off next week.
      - name: Look up campaign websites for anyone new on a ballot
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        if: env.FEC_API_KEY != ''
        run: python build_profile_site.py campaigns --limit 150 || true

      # Outside groups' independent expenditures for and against each
      # candidate, by candidate id (kyc/outside.py): about 70 requests at
      # the key's pace. A read that fails keeps the committed cache and
      # stops nothing else in this run. The seats' last elections
      # (kyc/seat_history.py) are a past count and are not re-read here.
      - name: Refresh outside spending
        continue-on-error: true
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        if: env.FEC_API_KEY != ''
        run: python build_profile_site.py outside

      - name: Refresh financial disclosure links (House Clerk and Senate eFD)
        run: python build_profile_site.py disclosures

      # Who runs each state: governors (NGA, checked against Wikidata),
      # NCSL's party counts, lieutenant governors (NLGA), secretaries of
      # state (NASS), attorneys general (their offices), every state
      # legislator (Open States) and each highest court's members (the
      # courts). Each command refuses an incomplete roster rather than
      # writing it, and a change reaches the page only through this run's
      # pull request. No key needed. A roster that cannot be read keeps the
      # committed cache and stops nothing else in this run (rule 8): on
      # 2026-10-19 one association's page that did not resolve in DNS
      # stopped the whole daily refresh, money and results with it, when
      # these four ran as one step.
      - name: Refresh the governors and party counts
        continue-on-error: true
        run: python build_profile_site.py executives

      - name: Refresh the statewide officers
        continue-on-error: true
        run: python build_profile_site.py officers

      - name: Refresh the state legislators
        continue-on-error: true
        run: python build_profile_site.py statelegs

      - name: Refresh the state high courts
        continue-on-error: true
        run: python build_profile_site.py courts

      # The President, the Vice President and the Cabinet: the White House's
      # pages, each office's own page and the Senate's roll calls
      # (kyc/federal.py). A source that cannot be read keeps the committed
      # cache and stops nothing else in this run.
      - name: Refresh the federal executive
        continue-on-error: true
        run: python build_profile_site.py federal

      # The financial reports the President, the Vice President and the
      # Cabinet filed with the Office of Government Ethics, attributed by
      # office and checked against the filer each report names
      # (kyc/oge.py). After the executive, whose holders it reads. A read
      # that fails keeps the committed cache.
      - name: Refresh the officers' financial disclosures
        continue-on-error: true
        run: python build_profile_site.py oge

      # Every sitting federal judge, from the Federal Judicial Center's
      # nightly directory, and the Supreme Court as the Court lists it
      # (kyc/judiciary.py). A source that cannot be read, or reads short,
      # keeps the committed cache and stops nothing else in this run.
      - name: Refresh the federal judiciary
        continue-on-error: true
        run: python build_profile_site.py judiciary

      # Vacancies in the federal courts, as the courts list them on
      # uscourts.gov (kyc/vacancies.py). A list that cannot be read, or whose
      # rows do not add up to its own totals, keeps the committed cache.
      - name: Refresh the judicial vacancies
        continue-on-error: true
        run: python build_profile_site.py vacancies

      # Each state's official voting pages, as NASS's "Can I Vote" lists
      # them, every link opened once. Refused unless all 50 states and D.C.
      # are there. A NASS outage or bot wall leaves the committed links as
      # they were and stops nothing else in this run.
      - name: Refresh each state's official voting pages
        continue-on-error: true
        run: python build_profile_site.py voting

      # Every tribal government and its leader, as the BIA's Tribal Leaders
      # Directory lists them (kyc/tribes.py). Refused unless every row the
      # service counts comes back once; a failed read keeps the committed
      # cache and stops nothing else in this run.
      - name: Refresh the tribal leaders directory
        continue-on-error: true
        run: python build_profile_site.py tribes

      # How each member voted: the roll calls posted since the last run, from
      # the House Clerk's and the Senate's own records, one request a second
      # (kyc/rollcalls.py). A refused or failed request ends the run with
      # what was read saved; the next run goes on from there.
      - name: Read the new roll calls
        continue-on-error: true
        timeout-minutes: 30
        run: python build_profile_site.py votes

      # The public offices each person has held: Congress from
      # congress-legislators, every other office from Wikidata where the
      # person's own Wikipedia article gives the same office the same years
      # (kyc/history.py). After the results and the executive, whose
      # articles and ids it reads. A read that fails or comes back short
      # keeps the committed cache and stops nothing else in this run.
      - name: Refresh the public offices each person has held
        continue-on-error: true
        run: python build_profile_site.py history

      # Members' education and careers from the Congressional Directory (on
      # GovInfo, through the api.data.gov key the FEC uses), the issues their
      # official sites list, a checked contact page, and their offices at
      # home (kyc/members.py, rule 86). Sites read in the last 27 days are
      # skipped and a run reads at most 150, one request at a time; a read
      # that concludes nothing keeps the last one.
      - name: Refresh members' biographies, platforms and offices
        continue-on-error: true
        timeout-minutes: 40
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        run: python build_profile_site.py members --limit 150

      # What a filed candidate's own sources say - the birth date, education
      # and occupation in the article their ballot page links; their
      # campaign's description of itself, its issues page and its portrait -
      # and a read of every linked campaign site, so a domain that lapses into
      # a gambling page is caught by the next run rather than by a reader.
      # Anyone read in the last six days is skipped. No API key involved.
      # Then up to forty sites with no portrait anywhere are drawn in a
      # headless Chrome and read again by the same rules (images a script
      # draws, bot walls a browser passes); no Chrome, or a page it cannot
      # read, keeps the last drawn read and stops nothing.
      - name: Fill gaps from candidates' articles and campaign sites
        run: python build_profile_site.py enrich

      # The websites the Census listed for local governments, looked at
      # again so a domain that lapses into gambling or parking is withdrawn
      # by a run rather than found by a reader (rule 78). Oldest first and
      # capped, so each run takes a share and every address is looked at
      # within about six weeks even on a weekly schedule; the build warns
      # once one has gone 60 days. A look that concludes nothing never
      # undoes a withdrawal, and plain gambling stays for a person.
      - name: Look again at local governments' listed websites
        continue-on-error: true
        timeout-minutes: 45
        run: python build_profile_site.py localgov --check-sites --limit 6000 --max-minutes 35

      # Market prices are not refreshed here: .github/workflows/odds.yml
      # does that every twelve hours and publishes on its own. The build
      # below leaves data/odds.js alone unless odds.json changed, so this
      # pull request never collides with it.

      - name: Rebuild the site data
        run: python build_profile_site.py

      - name: Confirm the result is valid and self-consistent
        run: |
          python build_profile_site.py build --check --strict --verbose
          python build_profile_site.py verify
          python -m unittest discover tests

      - name: Open a pull request if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "Congress has not changed and no source has been updated."
            exit 0
          fi

          # The run id keeps the name unique: a branch left behind by an
          # earlier failed run on the same day made the push fail.
          branch="refresh/congress-$(date -u +%Y-%m-%d)-${{ github.run_id }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "Reconcile the rosters with the current Congress

          Opened automatically by .github/workflows/refresh.yml. Congressional
          membership comes from congress-legislators; a new member's
          education, careers and platform are left empty rather than
          invented until the members command reads them from the
          Congressional Directory and their official site, and net worth is
          never derived. State governments come from their own
          authorities: governors from the NGA, lieutenant governors from NLGA,
          secretaries of state from NASS, legislators from Open States, party
          counts from NCSL."
          git push -u origin "$branch"

          gh pr create \
            --base "${{ github.ref_name }}" \
            --head "$branch" \
            --title "Reconcile the rosters with the current Congress" \
            --body "$(cat <<BODY
          Automated weekly reconciliation against
          [congress-legislators](https://github.com/unitedstates/congress-legislators).

          \`\`\`
          ${{ steps.reconcile.outputs.summary }}
          \`\`\`

          Only fields the dataset actually knows are written. Education, net
          worth, committees and platform stay empty for anyone new, so the
          provenance layer reports them as *No data* rather than showing an
          invention.

          The same run re-reads state governments from their own authorities:
          governors (National Governors Association, checked against
          Wikidata), lieutenant governors (NLGA), secretaries of state (NASS),
          state legislators (Open States) and party counts (NCSL).

          Validation, \`verify\` and the unit tests all ran before this was
          opened. It merges itself once its CI passes; a change of
          officeholder in it is worth reading afterwards.
          BODY
          )"

          # A pull request opened with the workflow's own token starts no CI
          # of its own that runs: GitHub holds it at "action_required" for a
          # person to approve, and #50 and #51 sat that way for days in
          # October 2026. A dispatched run is not held.
          gh workflow run ci.yml --ref "$branch"

          # A newer refresh carries everything an older one did. Leaving both
          # open asked a reviewer to read the same data twice. The branch is
          # kept; only the pull request closes.
          new=$(gh pr view "$branch" --json number --jq .number)
          for old in $(gh pr list --state open --json number,headRefName \
              --jq '.[] | select(.headRefName | startswith("refresh/")) | .number'); do
            if [ "$old" != "$new" ]; then
              gh pr close "$old" --comment "Superseded by #$new, opened by a newer refresh run."
            fi
          done

          # It merges itself once its checks pass (PK, 2026-10-14). After the
          # election the results reach the page only through this pull
          # request, and one that waited for a person kept the site eight days
          # behind. The run above already passed build --check --strict,
          # verify and the unit tests; CI adds the page tests. If CI fails,
          # the pull request stays open, this step fails and the failure
          # issue below says so.
          # The dispatched run only: the pull_request run on the same commit
          # is the one GitHub holds at "action_required", and watching it
          # failed the first auto-merging refresh (2026-10-14, #60) although
          # the dispatched run had passed.
          sha=$(git rev-parse HEAD)
          run=""
          for _ in $(seq 1 24); do
            run=$(gh run list --workflow ci.yml --branch "$branch" --event workflow_dispatch \
              --json databaseId,headSha \
              --jq "map(select(.headSha == \"$sha\")) | .[0].databaseId // empty")
            [ -n "$run" ] && break
            sleep 5
          done
          if [ -z "$run" ]; then
            echo "::error::No CI run started for $branch; #$new is left for a person."
            exit 1
          fi
          gh run watch "$run" --exit-status --interval 30
          gh pr merge "$new" --merge --delete-branch
          # A merge made with this token starts no workflow of its own.
          gh workflow run deploy.yml --ref main -f reason="refresh #$new merged"

      # A failed scheduled run used to be silent: nobody watches the Actions
      # tab, and the site kept serving the old field. Open an issue, or
      # comment on the one already open, so the failure reaches a person.
      - name: Report the failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Weekly refresh failed"
          body="The refresh run on $(date -u +%Y-%m-%d) failed: $RUN_URL"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi

      # The failure issue stays meaningful only if a good run closes it: an
      # issue left open after the refresh recovered reads as a live outage.
      - name: Close the failure issue after a good run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Weekly refresh failed"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" \
              --comment "The refresh recovered on $(date -u +%Y-%m-%d): $RUN_URL"
          fi

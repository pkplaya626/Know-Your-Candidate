# Keep the rosters in step with Congress.
#
# The roster CSVs are accurate but cannot stay current on their own. Members
# resign, die, and win special elections between builds, and a hand-maintained
# CSV has no way to notice: two representatives seated in September 2026 were
# simply absent from the site until this reconciliation was written.
#
# This opens a pull request. It never pushes to main and never deploys, so a
# change in the membership of Congress arrives as something a person reads and
# merges.

name: Refresh

on:
  schedule:
    # Mondays and Thursdays, 07:20 UTC. Off the hour because GitHub's
    # scheduler queues heavily at :00 and skips runs it cannot start.
    # Thursdays only until the 2026-11-03 election: in the run-up a week-old
    # field misses withdrawals and results. The `gate` job below skips the
    # Thursday run after the election, so nobody has to remember to edit this.
    - cron: "20 7 * * 1,4"
  workflow_dispatch:
    inputs:
      portraits:
        description: "Also resolve portraits for anyone new"
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  # A failed run opens (or comments on) a "Weekly refresh failed" issue.
  issues: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  gate:
    name: Decide whether this run is due
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.due.outputs.run }}
    steps:
      - id: due
        run: |
          # The extra Thursday run exists only for the 2026 election.
          if [ "${{ github.event_name }}" = "schedule" ] \
             && [ "$(date -u +%u)" = "4" ] \
             && [ "$(date -u +%Y-%m-%d)" \> "2026-11-03" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  refresh:
    name: Reconcile against congress-legislators
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh the membership snapshot and apply any drift
        id: reconcile
        run: |
          python build_profile_site.py congress --apply --verbose | tee reconcile.log
          # Surface the summary line in the PR body rather than making a
          # reviewer open the run log.
          {
            echo 'summary<<REPORT'
            grep -E '^\s+(reconciliation:|\+|-|~)' reconcile.log || echo "  no drift"
            echo REPORT
          } >> "$GITHUB_OUTPUT"
          rm reconcile.log

      # A member with no portrait shows a silhouette. Resolving here means the
      # PR arrives complete rather than needing a second pass.
      #
      # On a schedule the `inputs` context is empty, so the old condition
      # `inputs.portraits != false` compared null with false - and portraits
      # never ran on the weekly refresh. Only a manual run can opt out.
      - name: Resolve portraits for anyone new
        if: github.event_name != 'workflow_dispatch' || inputs.portraits
        run: python build_profile_site.py portraits

      # Optional. Without the secret this is skipped entirely rather than
      # burning the run on DEMO_KEY, which the FEC throttles after a handful
      # of requests. Add it at Settings -> Secrets -> Actions -> FEC_API_KEY.
      #
      # The condition tests `env`, not `secrets`: the secrets context is not
      # available in a step-level `if`, so the obvious spelling would never be
      # true and the step would silently never run.
      #
      # --refresh: without it `fec.resolve_all` fetches only profiles missing
      # from the cache, so every cached incumbent kept the totals of the day
      # they were first looked up while challengers' totals moved weekly.
      # Request budget (the key allows 1000 an hour): about 540 members by id
      # at one request each, ~60 roster challengers at up to two, ~45 pages of
      # the field, and the campaign lookups below - capped to stay under it.
      - name: Refresh campaign finance
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        if: env.FEC_API_KEY != ''
        run: python build_profile_site.py finance --refresh

      # Who has filed, and - from the state election pages - who is still in.
      - name: Refresh the candidate field and primary results
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        if: env.FEC_API_KEY != ''
        run: |
          python build_profile_site.py field
          python build_profile_site.py results

      # Campaign websites, one committee lookup each. Capped so the weekly
      # run stays inside the key's hourly budget alongside the steps above;
      # the cache resumes where it left off next week.
      - name: Look up campaign websites for anyone new on a ballot
        env:
          FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
        if: env.FEC_API_KEY != ''
        run: python build_profile_site.py campaigns --limit 150 || true

      - name: Refresh financial disclosure links (House Clerk and Senate eFD)
        run: python build_profile_site.py disclosures

      # What a filed candidate's own sources say - the birth date, education
      # and occupation in the article their ballot page links; their
      # campaign's description of itself, its issues page and its portrait -
      # and a read of every linked campaign site, so a domain that lapses into
      # a gambling page is caught by the next run rather than by a reader.
      # Anyone read in the last six days is skipped. No API key involved.
      - name: Fill gaps from candidates' articles and campaign sites
        run: python build_profile_site.py enrich

      # Market prices are not refreshed here: .github/workflows/odds.yml
      # does that every twelve hours and publishes on its own. The build
      # below leaves data/odds.js alone unless odds.json changed, so this
      # pull request never collides with it.

      - name: Rebuild the site data
        run: python build_profile_site.py

      - name: Confirm the result is valid and self-consistent
        run: |
          python build_profile_site.py build --check --strict --verbose
          python build_profile_site.py verify
          python -m unittest discover tests

      - name: Open a pull request if anything changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet; then
            echo "Congress has not changed and no source has been updated."
            exit 0
          fi

          # The run id keeps the name unique: a branch left behind by an
          # earlier failed run on the same day made the push fail.
          branch="refresh/congress-$(date -u +%Y-%m-%d)-${{ github.run_id }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add -A
          git commit -m "Reconcile the rosters with the current Congress

          Opened automatically by .github/workflows/refresh.yml against
          congress-legislators. Every field written here comes from that
          dataset; education, net worth, committees and platform are editorial
          research and are left empty rather than invented."
          git push -u origin "$branch"

          gh pr create \
            --base "${{ github.ref_name }}" \
            --head "$branch" \
            --title "Reconcile the rosters with the current Congress" \
            --body "$(cat <<BODY
          Automated weekly reconciliation against
          [congress-legislators](https://github.com/unitedstates/congress-legislators).

          \`\`\`
          ${{ steps.reconcile.outputs.summary }}
          \`\`\`

          Only fields the dataset actually knows are written. Education, net
          worth, committees and platform stay empty for anyone new, so the
          provenance layer reports them as *No data* rather than showing an
          invention.

          Validation, \`verify\` and the unit tests all ran before this was opened.
          BODY
          )"

      # A failed scheduled run used to be silent: nobody watches the Actions
      # tab, and the site kept serving the old field. Open an issue, or
      # comment on the one already open, so the failure reaches a person.
      - name: Report the failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Weekly refresh failed"
          body="The refresh run on $(date -u +%Y-%m-%d) failed: $RUN_URL"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"
          fi

      # The failure issue stays meaningful only if a good run closes it: an
      # issue left open after the refresh recovered reads as a live outage.
      - name: Close the failure issue after a good run
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Weekly refresh failed"
          number=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "\"$title\" in:title" --json number,title \
            --jq "map(select(.title == \"$title\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" \
              --comment "The refresh recovered on $(date -u +%Y-%m-%d): $RUN_URL"
          fi

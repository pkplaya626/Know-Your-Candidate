name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    name: Pipeline (Python ${{ matrix.python-version }})
    # ubuntu-latest becomes Ubuntu 26.04 from 2026-10-19, and actions/setup-python
    # has no Python 3.9 build for it (its manifest stops at 24.04), so the oldest
    # version we claim stays on 24.04.
    runs-on: ${{ matrix.python-version == '3.9' && 'ubuntu-24.04' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        # The pipeline is standard-library only; check the range we claim.
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Confirm the pipeline still needs no third-party packages
        run: |
          test ! -f requirements.txt \
            || { echo "requirements.txt appeared; the pipeline is meant to stay dependency-free"; exit 1; }
          python - <<'PY'
          import pathlib, re, sys
          text = pathlib.Path("pyproject.toml").read_text(encoding="utf-8")
          block = re.search(r"^dependencies\s*=\s*\[(.*?)\]", text, re.S | re.M)
          if block and block.group(1).strip():
              sys.exit("pyproject.toml declares runtime dependencies; the pipeline is meant to stay dependency-free")
          print("ok: no runtime dependencies declared")
          PY

      - name: Unit tests
        run: python -m unittest discover tests -v

      - name: Validate the data (no network)
        run: python build_profile_site.py build --check --strict --verbose

      # Two separate questions, and conflating them is what broke this step
      # before: a rebuild always stamps a fresh timestamp, so `git diff` could
      # only be kept quiet by committing the fixed SOURCE_DATE_EPOCH date and
      # showing 2001 to readers as the site's freshness stamp.
      - name: The committed data still matches the sources
        run: python build_profile_site.py verify

      - name: A rebuild is byte-for-byte reproducible
        env:
          SOURCE_DATE_EPOCH: "1000000000"
        run: |
          python build_profile_site.py > /dev/null
          cp candidate_profiles_site/data/profiles.js "$RUNNER_TEMP/profiles.1.js"
          cp candidate_profiles_site/data/geo.js "$RUNNER_TEMP/geo.1.js"
          cp -r candidate_profiles_site/data/districts "$RUNNER_TEMP/districts.1"
          python build_profile_site.py > /dev/null
          cmp "$RUNNER_TEMP/profiles.1.js" candidate_profiles_site/data/profiles.js
          cmp "$RUNNER_TEMP/geo.1.js" candidate_profiles_site/data/geo.js
          diff -r "$RUNNER_TEMP/districts.1" candidate_profiles_site/data/districts
          echo "ok: two builds at the same epoch are identical"
          git checkout -- candidate_profiles_site/data/

  site:
    name: Site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # jsdom 30 requires ^22.22.2 || ^24.15.0 || >=26. Node 20 installed
          # it happily and then died inside undici at require() time.
          node-version: "24"

      - name: Every shipped script parses
        run: |
          for f in candidate_profiles_site/assets/*.js candidate_profiles_site/data/*.js candidate_profiles_site/data/districts/*.js; do
            node --check "$f" || exit 1
          done

      # The site deliberately ships no third-party CSS or JavaScript. It used
      # to pull Tailwind's play CDN, an unpinned lucide build, d3 and
      # topojson-client - four runtime dependencies for a page that must keep
      # working offline and from a file:// URL.
      - name: No third-party runtime dependencies
        run: |
          # In Python rather than grep, because the test is "does this tag
          # *load* something remote", which depends on rel= as well as href=
          # and cannot assume attribute order. The original grep matched every
          # <link> with an https href and so failed on rel="canonical", a tag
          # that loads nothing at all.
          python3 - <<'PY'
          import pathlib, re, sys

          LOADS = {"stylesheet", "preload", "preconnect", "dns-prefetch", "icon"}
          offenders = []
          # Every folder: the generated pages sit one level down.
          for page in pathlib.Path("candidate_profiles_site").rglob("*.html"):
              html = page.read_text(encoding="utf-8")
              for tag in re.findall(r"<script\b[^>]*>", html):
                  if re.search(r'src="https?:', tag):
                      offenders.append(f"{page.name}: {tag}")
              for tag in re.findall(r"<link\b[^>]*>", html):
                  if not re.search(r'href="https?:', tag):
                      continue
                  rel = re.search(r'rel="([^"]+)"', tag)
                  if rel and LOADS & set(rel.group(1).split()):
                      offenders.append(f"{page.name}: {tag}")
          if offenders:
              sys.exit("A page loads a remote asset:\n  " + "\n  ".join(offenders))
          print("ok: no remote assets loaded")
          PY
          # Match a real URL, not the comments that record why these are gone.
          if grep -rniE '//(cdn\.tailwindcss\.com|unpkg\.com|cdnjs\.cloudflare\.com|d3js\.org|cdn\.jsdelivr\.net|fonts\.googleapis\.com)' \
               candidate_profiles_site/; then
            echo "A CDN reference came back."
            exit 1
          fi
          echo "ok: no remote assets"

      # Everything user-visible goes through KYC.renderField or
      # KYC.escapeHtml. These pages describe real, named people.
      - name: No inline event handlers in the markup
        run: |
          # Every page in every folder (rule 47), and every module.
          if grep -rnE --include='*.html' --include='*.js' '\son(click|error|load|change|submit)=' \
               candidate_profiles_site/ --exclude-dir=data; then
            echo "An inline event handler is back; use delegated listeners."
            exit 1
          fi
          echo "ok: no inline handlers"

      - name: Render both pages and exercise the UI
        run: |
          npm install --no-fund --no-audit
          npm test

  links:
    name: Local asset references resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Every href/src on a page exists on disk
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          site = pathlib.Path("candidate_profiles_site")
          missing = []
          # Every folder, each reference relative to its own page: checking
          # only the root let all 56 district pages link a states index
          # that did not exist (CLAUDE.md rule 47).
          for page in site.rglob("*.html"):
              html = page.read_text(encoding="utf-8")
              for ref in re.findall(r'(?:src|href)="([^"#?][^"]*)"', html):
                  if ref.startswith(("http:", "https:", "data:", "mailto:", "#")):
                      continue
                  target = ref.split("#")[0].split("?")[0]
                  if target and not (page.parent / target).exists():
                      missing.append(f"{page.relative_to(site)} -> {ref}")
          if missing:
              sys.exit("Broken local references:\n  " + "\n  ".join(missing))
          print("ok: every local reference resolves")
          PY
